[project]
name = "cell_cell_communication"
version = "0.1.0"
description = "Cell-cell communication and spatial deconvolution analyses (squidpy, LIANA, cell2location)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  # spatial / single-cell core (squidpy pulls anndata, scanpy, spatialdata, dask, zarr, omnipath, ...)
  "squidpy>=1.6",
  "spatialdata-plot>=0.4.1",
  "napari-spatialdata",
  "leidenalg>=0.11.0",
  # cell-cell communication
  "liana>=1.10.0",
  # deconvolution / mapping
  "cell2location>=0.1.5",
  "pyro-ppl==1.9.1",
  # plotting / notebooks
  "plotly>=7.1.0",
  "ipython>=9.17.1",
  "nbconvert>=7.17.1",
  "anndata>=0.13.4",
  "kaleido==0.2.1",
]

[dependency-groups]
dev = [
  "ipykernel",
  "ipywidgets",
  "jupyterlab",
  "ruff",
]

# Analysis project, not an installable package: uv skips building/installing it.
[tool.uv]
package = false

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I", "B", "UP"]
lint.ignore = ["E501", "E731", "E741"]
